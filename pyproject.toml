[project]
name = "mouse-gait-pq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deeplabcut[gui,pytorch]>=3.0.2",
    "imageio-ffmpeg>=0.6.0",
    "seaborn>=0.13.2",
    "shapely>=2.2.0",
    "tqdm>=4.70.1",
]

[project.scripts]
mouse-gait = "mouse_gait.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mouse_gait"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "rumdl>=0.3.0",
    "types-seaborn>=0.13.2.20261006",
    "types-shapely>=2.1.0.20260728",
    "types-tqdm>=4.70.0.20260906",
]

[tool.ruff]
# scripts/ run in the DeepLabCut environment, which uses an older Python
per-file-target-version = { "scripts/*" = "py310" }

[[tool.mypy.overrides]]
module = ["deeplabcut", "deeplabcut.*", "imageio_ffmpeg", "napari", "napari.*"]
ignore_missing_imports = true  # no type info shipped

[tool.rumdl]
disable = ["MD013"]  # one paragraph per line, no hard wrapping
exclude = ["data", ".venv"]
